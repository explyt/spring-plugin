name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OHMYBUG_CLI_URL: https://raw.githubusercontent.com/OhMyX-AI/ohmybug-cli/e798687bb20cfaf0e6418eaee4aa81ecce41ec43/ohmybug.mjs

jobs:
  ohmybug:
    name: bug hunt
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the CLI
        run: curl -fsSL "$OHMYBUG_CLI_URL" -o "$RUNNER_TEMP/ohmybug.mjs"
      - name: Review the pull request
        env:
          OHMYBUG_API_KEY: ${{ secrets.OHMYBUG_API_KEY }}
          OHMYBUG_STORY: never
          OHMYBUG_TIMEOUT_S: 1800
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          findings="$RUNNER_TEMP/findings.txt"
          notes="$RUNNER_TEMP/notes.txt"
          status=0
          node "$RUNNER_TEMP/ohmybug.mjs" --base "origin/$BASE_REF" 2> "$notes" | tee "$findings" || status=$?
          cat "$notes" >&2
          {
            echo '## OhMyBug review'
            echo
            awk -v server="$GITHUB_SERVER_URL" -v repo="$GITHUB_REPOSITORY" -v sha="$HEAD_SHA" \
              -f .github/scripts/review-summary.awk "$findings"
            echo
            grep -E '^ohmybug: (silent bill|billing|story|could not review|the review)' "$notes" | sed 's/^ohmybug: /- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
