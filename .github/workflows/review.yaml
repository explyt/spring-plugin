name: review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OHMYBUG_CLI_URL: https://raw.githubusercontent.com/OhMyX-AI/ohmybug-cli/226fabfc82121a481d8bb3fdeec6a5667ab0fad4/ohmybug.mjs

jobs:
  ohmybug:
    name: bug hunt
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'bug-hunt')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the CLI
        run: curl -fsSL "$OHMYBUG_CLI_URL" -o "$RUNNER_TEMP/ohmybug.mjs"
      - name: Review the pull request
        env:
          OHMYBUG_API_KEY: ${{ secrets.OHMYBUG_API_KEY }}
          OHMYBUG_STORY: never
          OHMYBUG_TIMEOUT_S: 1800
          BASE_REF: ${{ github.base_ref }}
        run: |
          result="$RUNNER_TEMP/result.json"
          verbatim="$(uuidgen)"
          status=0
          echo "::stop-commands::$verbatim"
          node "$RUNNER_TEMP/ohmybug.mjs" --base "origin/$BASE_REF" --format json --step-summary > "$result" || status=$?
          jq -r '.findings[]? | "\(.severity // "unrated" | tostring | ascii_upcase)  \(.file // ""):\(.line // "")  \(.title // "")\n    \(.body // "")\n"' "$result" \
            || echo "the review result could not be read as JSON"
          echo "::$verbatim::"
          jq -r -f .github/scripts/review-annotations.jq "$result" \
            || echo "::warning title=Review annotations::The review result could not be turned into annotations"
          exit $status
